services:
  server:
    image: ${DOCKER_REGISTRY-}howsyourdayserver
    build:
      context: .
      dockerfile: HowsYourDay.Server/Dockerfile
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      App__DefaultTimeZone: ${APP_DEFAULT_TIMEZONE:-UTC}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Jwt__Key: ${JWT_KEY}
    depends_on:
      db:
        condition: service_healthy

  web:
    image: ${DOCKER_REGISTRY-}howsyourdayserverweb
    build:
      context: .
      dockerfile: HowsYourDay.Web/Dockerfile
    ports:
      - "5000:8080"

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
